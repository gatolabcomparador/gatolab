<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin — GATO LAB</title>
<!--
  Panel de administración de GATO LAB, con Decap CMS (antes "Netlify CMS").
  Incluye dos secciones: CATÁLOGO (los modelos de content/shoes.json) y NEWS
  (los artículos de content/news.json) — ambas se definen en admin/config.yml.
  No necesitas tocar este archivo. Para activarlo de verdad, sigue los
  pasos de README.md, sección 7 ("NEWS: activar el panel de administración";
  la misma activación vale para las dos secciones).
-->
</head>
<body>
  <!-- Netlify Identity: gestiona el inicio de sesión de /admin/ -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>

  <!-- Decap CMS (antes Netlify CMS): lee admin/config.yml y genera el editor -->
  <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>

  <!-- Buscador del CATÁLOGO: filtra la lista de modelos del editor por marca/modelo -->
  <script>
    (function () {
      var BOX_ID = "gl-buscador";
      var q = "";

      function norm(s) {
        return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
      }
      function enCatalogo() {
        return /#\/collections\/shoes\//.test(location.hash);
      }
      // Cada modelo de la lista es un "SortableListItem" con su título ("NestedObjectLabel")
      function items() {
        return Array.prototype.filter.call(
          document.querySelectorAll('[class*="SortableListItem"]'),
          function (el) {
            // solo los modelos de primer nivel (no las listas internas de fotos, características...)
            return el.querySelector(':scope > [class*="NestedObjectLabel"]') &&
              !el.parentElement.closest('[class*="SortableListItem"]');
          }
        );
      }
      function label(el) {
        var lab = el.querySelector(':scope > [class*="NestedObjectLabel"]');
        return lab ? lab.textContent : "";
      }
      function filtrar() {
        var box = document.getElementById(BOX_ID);
        if (!box) return;
        var palabras = norm(q).split(/\s+/).filter(Boolean);
        var lista = items(), vis = 0, primero = null;
        lista.forEach(function (el) {
          var t = norm(label(el));
          var ok = !palabras.length || !t || palabras.every(function (p) { return t.indexOf(p) !== -1; });
          // un modelo abierto no se oculta nunca (aunque al editarlo deje de coincidir con la búsqueda)
          if (!ok) {
            var lab = el.querySelector(':scope > [class*="NestedObjectLabel"]');
            if (lab && getComputedStyle(lab).display === "none") ok = true;
          }
          var disp = ok ? "" : "none";
          if (el.style.display !== disp) el.style.display = disp;
          if (ok) { vis++; if (!primero && t) primero = el; }
        });
        box.querySelector(".gl-n").textContent = palabras.length
          ? vis + " de " + lista.length + " modelos"
          : lista.length + " modelos";
        box._primero = primero;
      }
      function crearCaja() {
        var pane = document.querySelector('[class*="ControlPaneContainer"]');
        if (!pane) return;
        var box = document.getElementById(BOX_ID);
        if (box && pane.contains(box)) return;
        if (box) box.remove();
        box = document.createElement("div");
        box.id = BOX_ID;
        box.setAttribute("style",
          "position:sticky;top:0;z-index:50;background:#eff0f4;padding:10px 0 12px;" +
          "display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #dfdfe3;margin-bottom:12px");
        box.innerHTML =
          '<input type="search" id="gl-buscador-input" placeholder="Buscar modelo o marca (ej. skwama, scarpa drago)…" ' +
          'autocomplete="off" style="flex:1 1 260px;min-width:0;padding:10px 12px;font-size:15px;' +
          'border:2px solid #dfdfe3;border-radius:6px;background:#fff;outline:none">' +
          '<span class="gl-n" style="font-size:13px;color:#555;white-space:nowrap"></span>' +
          '<span style="flex-basis:100%;font-size:12px;color:#777">Enter: ir al primer resultado y abrirlo · Esc: borrar búsqueda</span>';
        pane.insertBefore(box, pane.firstChild);
        var inp = box.querySelector("input");
        inp.value = q;
        inp.addEventListener("focus", function () { inp.style.borderColor = "#3a69c7"; });
        inp.addEventListener("blur", function () { inp.style.borderColor = "#dfdfe3"; });
        inp.addEventListener("input", function () { q = inp.value; filtrar(); });
        inp.addEventListener("keydown", function (e) {
          if (e.key === "Escape") { inp.value = ""; q = ""; filtrar(); }
          if (e.key === "Enter") {
            e.preventDefault();
            var el = box._primero;
            if (!el) return;
            var body = el.querySelector(':scope > [class*="NestedObjectLabel"]');
            var cerrado = body && getComputedStyle(body).display !== "none";
            var boton = el.querySelector("button");
            if (cerrado && boton) boton.click();
            el.style.scrollMarginTop = (box.offsetHeight + 12) + "px";
            setTimeout(function () { el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 50);
          }
        });
        filtrar();
      }
      var pendiente = false;
      new MutationObserver(function () {
        if (pendiente) return;
        pendiente = true;
        requestAnimationFrame(function () {
          pendiente = false;
          if (!enCatalogo()) {
            var b = document.getElementById(BOX_ID);
            if (b) b.remove();
            return;
          }
          crearCaja();
          if (q) filtrar();
          else { var box = document.getElementById(BOX_ID); if (box) box.querySelector(".gl-n").textContent = items().length + " modelos"; }
        });
      }).observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>
