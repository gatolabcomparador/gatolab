<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin — GATO LAB</title>
<!--
  Panel de administración de GATO LAB, con Decap CMS (antes "Netlify CMS").
  Incluye dos secciones: CATÁLOGO (los modelos de content/shoes.json) y NEWS
  (los artículos de content/news.json) — ambas se definen en admin/config.yml.
  No necesitas tocar este archivo. Para activarlo de verdad, sigue los
  pasos de README.md, sección 7 ("NEWS: activar el panel de administración";
  la misma activación vale para las dos secciones).
-->
</head>
<body>
  <!-- Netlify Identity: gestiona el inicio de sesión de /admin/ -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>

  <!-- Decap CMS (antes Netlify CMS): lee admin/config.yml y genera el editor -->
  <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>

  <!--
    VISTA PREVIA EN DIRECTO DEL CATALOGO
    Al editar un modelo en CATALOGO, se muestra una rejilla con la pinta
    real de las fichas de GATO LAB (foto, marca, modelo, cierre y precio),
    actualizada mientras escribes. No toca el diseno de la web publica.
  -->
  <script>
  if (window.CMS && window.createClass && window.h) {
  var ShoesPreview = createClass({
  render: function () {
  var items = this.props.widgetsFor("zapatillas");
  if (!items) return h("div", {style:{padding:"20px"}}, "Cargando...");
  var cards = items.map(function (item, i) {
if (!item) { return null; }
  var d = item.data;
  if (!d) return null;
  var fotos = d.get("fotos");
  var foto = fotos && fotos.size ? fotos.get(0) : null;
  return h("div", {key:i, style:{background:"#fff", border:"1px solid #e2e2e2", borderRadius:"10px", overflow:"hidden", display:"flex", flexDirection:"column"}},
  h("div", {style:{aspectRatio:"4/3", background:"#f0f0f0", display:"flex", alignItems:"center", justifyContent:"center", overflow:"hidden"}},
  foto ? h("img", {src: foto, style:{width:"100%", height:"100%", objectFit:"cover"}, onError: function(ev){ ev.target.style.display = "none"; }}) : h("span", {style:{color:"#999", fontSize:"12px"}}, "Sin foto")
  ),
  h("div", {style:{padding:"10px 12px 14px"}},
  h("div", {style:{fontWeight:700, fontSize:"11px", textTransform:"uppercase", color:"#666"}}, d.get("marca") || "-"),
  h("div", {style:{fontWeight:800, fontSize:"16px", marginTop:"2px"}}, d.get("modelo") || "-"),
  h("div", {style:{marginTop:"8px", fontSize:"12px", color:"#666"}}, (d.get("cierre") || "-") + " . " + (d.get("precio") != null ? d.get("precio") + " EUR" : "sin precio"))
  )
  );
  }).toArray();
  return h("div", {style:{fontFamily:"Archivo, Helvetica, sans-serif", padding:"18px", background:"#fafafa"}},
  h("div", {style:{fontSize:"13px", color:"#888", marginBottom:"14px"}}, "Vista previa - asi se ven las fichas en gatolab.es (" + cards.length + " modelos)"),
  h("div", {style:{display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(180px, 1fr))", gap:"14px"}}, cards)
  );
  }
  });
  CMS.registerPreviewTemplate("modelos", ShoesPreview);
  }
  </script>
</body>
</html>
